<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Inventory Dash</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: #f5f5f5; text-align: left; }
    .bad { color:#b91c1c; font-weight:600; }
    .muted { color:#666; font-size:12px; }
  </style>
</head>
<body>
  <h2>Dashboard</h2>

  <div class="muted">
    Project ID: <input id="pid" type="number" value="1" style="width:80px;" />
    <button onclick="load()">Load</button>
    <span id="meta"></span>
  </div>

  <div id="content" style="margin-top:12px;"></div>

<script>
async function load(){
  const pid = document.getElementById("pid").value;
  const res = await fetch("/projects/" + pid + "/dash");
  const data = await res.json();

  const meta = document.getElementById("meta");
  meta.textContent = "shelves: " + (data.shelves?.length || 0);

  const content = document.getElementById("content");
  if (!data.shelves || data.shelves.length === 0){
    content.innerHTML = "<i>No shelves</i>";
    return;
  }

  let html = "";
  for (const sh of data.shelves){
    html += "<h3>" + sh.shelf_name + " (id " + sh.shelf_id + ")</h3>";
    html += "<div class='muted'>day_utc: " + sh.day_utc + "</div>";
    html += "<table><thead><tr>" +
      "<th>bin</th><th>product</th><th>qty</th><th>delta today</th><th>warning</th>" +
      "</tr></thead><tbody>";

    for (const b of sh.bins){
      const warn = (b.mismatch === 1) ? "MISMATCH" : "";
      html += "<tr>" +
        "<td>" + (b.bin_code ?? "") + "</td>" +
        "<td>" + (b.product_name ?? "") + "</td>" +
        "<td>" + (b.qty ?? "") + "</td>" +
        "<td>" + (b.delta_today ?? "") + "</td>" +
        "<td class='" + (warn ? "bad" : "") + "'>" + warn + "</td>" +
      "</tr>";
    }

    html += "</tbody></table>";
  }

  content.innerHTML = html;
}

load();
setInterval(load, 8000);
</script>
</body>
</html>
